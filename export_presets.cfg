ssh_remote_deploy/run_script="Expand-Archive -LiteralPath '{temp_dir}\\{archive_name}' -DestinationPath '{temp_dir}'
$action = New-ScheduledTaskAction -Execute '{temp_dir}\\{exe_name}' -Argument '{cmd_args}'
$trigger = New-ScheduledTaskTrigger -Once -At 00:00
$settings = New-ScheduledTaskSettingsSet
$task = New-ScheduledTask -Action $action -Trigger $trigger -Settings $settings
Register-ScheduledTask VoxelBlockSmash -InputObject $task -Force:$true
Start-ScheduledTask -TaskName VoxelBlockSmash
while (-not (Get-Process -Name '{exe_name}' -ErrorAction SilentlyContinue)) { Start-Sleep -Milliseconds 100 }
$proc = Get-Process -Name '{exe_name}' -ErrorAction SilentlyContinue
while (-not $proc.HasExited) { Start-Sleep -Milliseconds 100 }
Unregister-ScheduledTask -TaskName VoxelBlockSmash -Confirm:$false -ErrorAction:SilentlyContinue"
ssh_remote_deploy/cleanup_script="Stop-ScheduledTask -TaskName VoxelBlockSmash -ErrorAction:SilentlyContinue
Unregister-ScheduledTask -TaskName VoxelBlockSmash -Confirm:$false -ErrorAction:SilentlyContinue
Remove-Item -Recurse -Force '{temp_dir}'"
